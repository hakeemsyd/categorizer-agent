[project]
name = "books"
version = "0.1.0"
description = "Bookkeeping automation: bank sync, AI categorization, human review."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "celery[redis]>=5.4",
    "redis>=5.2",
    "httpx>=0.27",
    "typer>=0.15",
    "rich>=13.9",
    "cryptography>=43.0",
    "structlog>=24.4",
    "plaid-python>=27.0",
    "pyjwt[crypto]>=2.9",
    "langgraph>=0.2.50",
    "langchain-core>=0.3.20",
    "langchain-anthropic>=0.3.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
books = "books.faces.cli.main:app"
books-mcp = "books.faces.mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/books"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]  # FastAPI/Typer rely on calls in argument defaults

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run: the session-scoped engine and the
# function-scoped sessions must share it, or asyncpg connections cross loops.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: requires a live Postgres (set BOOKS_TEST_DATABASE_URL)",
    "plaid: hits the real Plaid sandbox",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
packages = ["books"]
mypy_path = "src"
ignore_missing_imports = true
